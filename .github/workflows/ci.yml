name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        platform:
          - adam
          - apple2
          - atari
          - c64
          - coco
          - dragon
          - msdos
          # Won't build until a fujinet-lib release includes merged PR FujiNetWIFI/fujinet-lib#125
          #- msxrom
          # The H89 builds need a fujinet-lib with H89 support (see
          # FUJINET_LIB_H89 in the Makefile) and a z88dk with +hdos.
          #- h89-cpm
          #- h89-hdos

    container:
      image: fozztexx/defoogi:1.4.8

    steps:
      - uses: actions/checkout@v4

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: make ${{ matrix.platform }}/r2r

      - name: Upload artifact for ${{ matrix.platform }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: r2r/${{ matrix.platform }}/**
